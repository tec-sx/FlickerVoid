; Fact.Q1.* migrated to the chapter scoped Fact.Quest.<ChapterId>.<QuestId>.<Aspect> scheme.
; Two renames happened: first Fact.Q1.* -> Fact.Quest.Q1.*, then quests were nested
; under their chapter, giving Fact.Quest.Introduction.Q1.*. Only the final target is
; listed here, since a redirect chain is resolved in one hop.
;
; Note: Started/Finished were booleans and are replaced by the sparse Stage value
; (Accepted=20, Completed=100), so both old tags point at the same Stage fact.
; Any saved game with the old tags needs its VALUES remapped, not just renamed -
; a redirect cannot express "Finished=1 means Stage=100".
+GameplayTagRedirects=(OldTagName="Fact.Q1.Started",NewTagName="Fact.Quest.Introduction.Q1.Stage")
+GameplayTagRedirects=(OldTagName="Fact.Q1.Finished",NewTagName="Fact.Quest.Introduction.Q1.Stage")
