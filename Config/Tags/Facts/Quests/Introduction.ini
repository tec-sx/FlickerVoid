; Chapter: Introduction
;
; Layout:
;   Fact.Chapter.<ChapterId>.Stage                            EFVQuestStage
;   Fact.Chapter.<ChapterId>.Outcome                          designer defined outcome id
;   Fact.Quest.<ChapterId>.<QuestId>.Stage                    EFVQuestStage
;   Fact.Quest.<ChapterId>.<QuestId>.Outcome                  designer defined outcome id
;   Fact.Quest.<ChapterId>.<QuestId>.Objective.<ObjectiveId>  undefined = not issued, 0 = active, 1 = done
;   Fact.Quest.<ChapterId>.<QuestId>.Counter.<CounterId>      tallies
;
; Quests nest under their chapter so UndefineFactsUnderTag(Fact.Quest.Introduction)
; resets the whole chapter and Fact.Quest.Introduction.<QuestId> resets one quest.
;
; Which quests are REQUIRED to progress the chapter is NOT stored here. That is
; declared by Chapter_Introduction.flow, in the condition group it waits on.

[/Script/GameplayTags.GameplayTagsList]
GameplayTagList=(Tag="Fact.Chapter.Introduction.Stage",DevComment="Progress of the Introduction chapter. See EFVQuestStage.")
GameplayTagList=(Tag="Fact.Chapter.Introduction.Outcome",DevComment="Designer defined outcome id for the chapter.")

; --- BartenderBlackmail (REQUIRED) ---------------------------------------------
; The bartender resents the bar manager. The player agrees to gather leverage,
; goes through the Shady Dealer to reach the manager, and returns with photos.
GameplayTagList=(Tag="Fact.Quest.Introduction.BartenderBlackmail.Stage",DevComment="See EFVQuestStage.")
GameplayTagList=(Tag="Fact.Quest.Introduction.BartenderBlackmail.Outcome",DevComment="1 = photos delivered to the bartender, 2 = manager warned instead.")
GameplayTagList=(Tag="Fact.Quest.Introduction.BartenderBlackmail.Objective.ContactDealer",DevComment="Obtain the Shady Dealer's help.")
GameplayTagList=(Tag="Fact.Quest.Introduction.BartenderBlackmail.Objective.CompromiseManager",DevComment="Set up and photograph the bar manager.")
GameplayTagList=(Tag="Fact.Quest.Introduction.BartenderBlackmail.Objective.DeliverProof",DevComment="Hand the photos to the bartender.")

