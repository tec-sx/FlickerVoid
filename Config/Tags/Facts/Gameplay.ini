; Narrative relevant gameplay facts.
; Scheme:
;   Fact.Gameplay.Item.<ItemId>.<Aspect>       - key item obtained, handed over, destroyed
;   Fact.Gameplay.Interaction.<InteractionId>  - a specific interaction happened at least once
;   Fact.Gameplay.Counter.<CounterId>          - global tallies not owned by a quest
;
; Live inventory, cooldowns and attributes stay in their own systems. Only record
; here what the story actually needs to branch on.
; Roots are declared natively in FVGameplayTags.h. Add concrete facts below.

