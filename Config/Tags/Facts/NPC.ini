; Facts about NPCs and factions.
; Scheme:
;   Fact.NPC.<NpcId>.Met / .Alive / .Trust / .Disposition
;   Fact.NPC.<NpcId>.Knows.<TopicId>
;   Fact.Faction.<FactionId>.<Aspect>
;
; Everything for one NPC nests under Fact.NPC.<NpcId>, so UndefineFactsUnderTag
; can forget that NPC wholesale. Use UFVAIFactHelpers to build these at runtime.
; Roots are declared natively in FVAITags.h. Add concrete facts below.

