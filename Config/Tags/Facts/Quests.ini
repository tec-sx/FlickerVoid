; Fact tags for the narrative fact database.
;
; Naming scheme: Fact.<Domain>.<Subject>.<Aspect>
; Domain roots (Fact.Quest, Fact.Player, Fact.World, Fact.NPC, ...) are declared
; natively in each module's *Tags.h. Only concrete, content authored facts belong here.
;
; Per quest layout - everything nests under the quest so a single
; UndefineFactsUnderTag(Fact.Quest.<QuestId>) resets it:
;   Fact.Quest.<QuestId>.Stage              value = EFVQuestStage (0/10/20/30/50/100)
;   Fact.Quest.<QuestId>.Outcome            value = designer defined outcome id
;   Fact.Quest.<QuestId>.Objective.<ObjId>  value = 0 pending, 1 done (or a count)
;   Fact.Quest.<QuestId>.Counter.<Counter>  value = tally
;
; Prefer one file per quest under Config/Tags/Facts/Quests/ once quests grow.

[/Script/GameplayTags.GameplayTagsList]
