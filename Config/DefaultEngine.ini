[/Script/Engine.RendererSettings]

; ===== CORE =====
r.ForwardShading=False
r.AllowStaticLighting=True
r.GenerateMeshDistanceFields=True

; ===== NANITE =====
r.Nanite.ProjectEnabled=True
r.Nanite=1
r.Nanite.MaxPixelsPerEdge=1.5
r.Nanite.Foliage=True

; ===== SHADOWS =====
r.Shadow.Virtual.Enable=1
r.Shadow.Virtual.MaxPhysicalPages=4096
r.Shadow.CSM.MaxCascades=3

; ===== GLOBAL ILLUMINATION =====
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1

; ===== RAY TRACING =====
r.RayTracing=True
r.RayTracing.Shadows=False
r.RayTracing.UseTextureLod=True
r.RayTracing.Nanite.Mode=1
r.SkinCache.CompileShaders=True
r.SkinCache.DefaultBehavior=1

; ===== REFLECTIONS =====
r.SSR.Quality=4
r.SSR.Temporal=1
r.ReflectionCaptureResolution=256

; ===== DLSS =====
r.NGX.DLSS.Enable=1
r.NGX.DLSS.Quality=2
r.NGX.DLSS.Sharpness=0.15

; ===== RTX =====
r.SampledLighting.Direct=False

; ===== TONEMAPPING =====
r.Tonemapper.Sharpen=0.4

; ===== IMAGE QUALITY =====
r.ScreenPercentage=100
r.PostProcessAAQuality=6
r.Tonemapper.Sharpen=0.2
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.AutoExposure=False
r.FilmGrain=0

; ===== VELOCITY / GHOSTING =====
r.BasePassForceOutputsVelocity=1
r.Velocity.EnableVertexDeformation=1

; ===== TEXTURES =====
r.Streaming.PoolSize=8192
r.MeshStreaming=True

; ===== FOLIAGE =====
foliage.DitheredLOD=0

; ===== CLOUD / FOG =====
r.VolumetricFog=1
r.SkyAtmosphere=1

; ===== SKINNING =====
r.GPUSkin.Support16BitBoneIndex=True
r.GPUSkin.UnlimitedBoneInfluences=True
SkeletalMesh.UseExperimentalChunking=1

; ===== PERFORMANCE =====
r.RDG.AsyncCompute=1
r.GPUCrashDebugging=1
r.D3D12.PSO.DiskCache=1
r.HeterogeneousVolumes.Shadows=False

